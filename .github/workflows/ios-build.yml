name: iOS build

on:
  push:
    paths: ['TaskTracker/**', 'TaskTracker.xcodeproj/**', '.github/workflows/ios-build.yml']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          status=0
          xcodebuild \
            -project TaskTracker.xcodeproj \
            -scheme TaskTracker \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || status=$?
          grep -E "error:|warning: .*TaskTracker/|\*\* BUILD" build.log || tail -50 build.log
          exit $status
